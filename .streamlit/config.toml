# No `base` here on purpose: setting it pins the app to one palette and the
# viewer's preference is ignored. With [theme.light] and [theme.dark] defined,
# Streamlit follows the browser/OS setting and the CSS in theme.py lines up with
# an actually-dark ground instead of flipping text colour over a light one.

[server]
headless = true
fileWatcherType = "auto"
# Left on so ./static is available for future assets, but the FONTS do not use
# it: this route returns HTTP 500 in Streamlit 1.60 (see src/web_app/fonts.py).
enableStaticServing = true

[browser]
gatherUsageStats = false

# --- type ---------------------------------------------------------------
# GENERATED by `python -m src.web_app.fonts` - do not hand-edit the base64.
# Source of truth: src/web_app/static/fonts/*.woff2
#
# Embedded as data URIs because Streamlit 1.60's app-static route 500s here
# (gzip middleware: "Expected ASGI message 'http.response.start'"). The theme
# payload is sent once per session, so this costs nothing per rerun.
#
# "Fintor Serif" IS Source Serif 4, aliased: Streamlit bundles "Source Serif"
# and silently drops a declared face whose family name collides with it.

[[theme.fontFaces]]
family = "Inter Tight"
weight = "100 900"
style = "normal"
url = "data:font/woff2;base64,"

[[theme.fontFaces]]
family = "Fintor Serif"
weight = "200 900"
style = "normal"
url = "data:font/woff2;base64,"

[theme]
# Editorial instrument: a serif that reads institutional, against a precise
# grotesque with true tabular figures for the numbers.
font = "Inter Tight, system-ui, sans-serif"
headingFont = "Fintor Serif, Georgia, serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, monospace"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.0625rem", "1rem", "0.9375rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.light]
primaryColor = "#1f6f5c"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f2f0ea"
textColor = "#17211d"

[theme.dark]
primaryColor = "#5bbfa2"
backgroundColor = "#121714"
secondaryBackgroundColor = "#1b211e"
textColor = "#e7ebe6"
